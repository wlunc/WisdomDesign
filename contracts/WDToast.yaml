# WDToast — iOS 侧契约条目（M4）
# 副本来源：iOS/docs/M4-SIGNATURE-FREEZE.md §2.1
# 回填：2026-11-12（M4 批前冻结；按 docs/M4-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。

component: WDToast
params:
  - name: presented        # 受控值（C-15 canonical）
    ios: isPresented
    type: "Binding<Bool>"
  - name: variant
    ios: variant
    type: WDToastVariant
    default: .neutral
  - name: message
    ios: message
    type: Text
  - name: action
    ios: action
    type: "WDToastAction?"
    default: null
  - name: durationMilliseconds
    ios: durationMilliseconds
    type: Int
    default: 3000
  - name: onDismiss
    ios: onDismiss
    type: "(() -> Void)?"
    default: null

slots: [message, actions]

default:
  variant: .neutral
  action: null
  durationMilliseconds: 3000
  onDismiss: null

enums:
  WDToastVariant: [neutral, success, warning, danger]
