# WDPicker — iOS 侧契约条目（M5）
# 副本来源：../iOS/docs/M5-SIGNATURE-FREEZE.md §2.2
# 回填：2026-11-13（M5 批前冻结；按 docs/M5-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。
# 菜单 = 系统 Menu；滚轮 = 系统 Picker(.wheel) 底部弹出（Q2）。

component: WDPicker
params:
  - name: selection
    ios: selection
    type: "Binding<String?>"
  - name: label
    ios: label
    type: "Text"
  - name: options
    ios: options
    type: "[WDPickerOption]"
  - name: placeholder
    ios: placeholder
    type: "Text?"
    default: null
  - name: style
    ios: style
    type: "WDPickerStyle"
    default: .menu

slots: [label, options]

default:
  placeholder: null
  style: .menu

enums:
  WDPickerStyle: [menu, wheel]
