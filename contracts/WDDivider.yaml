# WDDivider — iOS 侧契约条目（M2）
# 副本来源：../iOS/docs/M2-SIGNATURE-FREEZE.md §5.1-⑥
# 回填：2026-11-12（M3 出口前；按 docs/CONTRACTS-CONFIRMATION-REQUEST.md §5.3 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。
# 增量：2026-11-15（B3，../iOS/docs/B3-CONTRACT-CHANGE-REQUEST.md）：新增 WDDividerStyle 与 init(style:)；既有 init() 保留。

component: WDDivider
params:
  - name: style          # 2026-11-15 B3 增量（init(style:)；既有 init() 仍为 .full）
    ios: style
    type: WDDividerStyle
    default: .full

slots: 无   # F-15：无槽位

default:
  style: .full

enums:
  WDDividerStyle: [full, inset]   # 2026-11-15 B3 新增类型
