# WDActionSheet — iOS 侧契约条目（M4）
# 副本来源：iOS/docs/SPEC.md §2.5 + iOS/docs/M4-SIGNATURE-FREEZE.md §2.1
# 回填：2026-11-12（M4 批前冻结；按 docs/M4-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。

component: WDActionSheet
params:
  - name: presented        # 受控值（C-15 canonical）
    ios: isPresented
    type: "Binding<Bool>"
  - name: title
    ios: title
    type: "Text?"
    default: null
  - name: message
    ios: message
    type: "Text?"
    default: null
  - name: items
    ios: items
    type: "[WDActionSheetItem]"
  - name: onSelect
    ios: onSelect
    type: "@escaping (WDActionSheetItem.ID) -> Void"
  - name: onCancel
    ios: onCancel
    type: "(() -> Void)?"
    default: null

slots: [title, message, items]

default:
  title: null
  message: null
  onCancel: null

enums:
  WDActionSheetItem.Role: [default, destructive, cancel]
