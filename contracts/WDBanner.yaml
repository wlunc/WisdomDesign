# WDBanner — iOS 侧契约条目（M4）
# 副本来源：iOS/docs/M4-SIGNATURE-FREEZE.md §2.2
# 回填：2026-11-12（M4 批前冻结；按 docs/M4-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。

component: WDBanner
params:
  - name: visible          # 受控值（C-15 canonical）
    ios: isVisible
    type: "Binding<Bool>"
  - name: variant
    ios: variant
    type: WDBannerVariant
    default: .info
  - name: message
    ios: message
    type: Text
  - name: action
    ios: action
    type: "WDBannerAction?"
    default: null
  - name: dismissAccessibilityLabel
    ios: dismissAccessibilityLabel
    type: "Text?"
    default: null

slots: [message, actions]

default:
  variant: .info
  action: null
  dismissAccessibilityLabel: null

enums:
  WDBannerVariant: [info, warning, danger]
