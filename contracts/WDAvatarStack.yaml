# WDAvatarStack — iOS 侧契约条目（M5）
# 副本来源：../iOS/docs/M5-SIGNATURE-FREEZE.md §2.1
# 回填：2026-11-13（M5 批前冻结；按 docs/M5-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。
# accessibilityLabel 必填（Q4；L-B：整叠只读一次的完整句由调用方给）；slots 仍只记 items。

component: WDAvatarStack
params:
  - name: items
    ios: items
    type: "[WDAvatarStackItem]"
  - name: accessibilityLabel
    ios: accessibilityLabel
    type: "Text"
  - name: size
    ios: size
    type: "WDAvatarStackSize"
    default: .md

slots: [items]

default:
  size: .md

enums:
  WDAvatarStackSize: [sm, md]
