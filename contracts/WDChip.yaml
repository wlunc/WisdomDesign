# WDChip — iOS 侧契约条目（M5）
# 副本来源：../iOS/docs/M5-SIGNATURE-FREEZE.md §2.1
# 回填：2026-11-13（M5 批前冻结；按 docs/M5-SIGNATURE-FREEZE.md 誊录，不改签名/默认值/槽位/枚举）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。
# 三个 init 编译期分离：展示 / 可选（isSelected）/ 可删除（deleteAccessibilityLabel + onDelete）。

component: WDChip
params:
  - name: selected
    ios: isSelected
    type: "Binding<Bool>?"
  - name: label
    ios: label
    type: "Text"
  - name: leadingIcon
    ios: leadingIcon
    type: "WDIconName?"
    default: null
  - name: size
    ios: size
    type: "WDChipSize"
    default: .standard
  - name: deleteAccessibilityLabel
    ios: deleteAccessibilityLabel
    type: "Text?"
    default: null
  - name: onDelete
    ios: onDelete
    type: "(() -> Void)?"
    default: null

slots: [label, leadingIcon]

default:
  leadingIcon: null
  size: .standard
  deleteAccessibilityLabel: null
  onDelete: null

enums:
  WDChipSize: [standard, compact]
