# WDBadge — iOS 侧契约条目（M2）；M5 增量（计数/圆点，Q7 = B）
# 副本来源：../iOS/docs/M2-SIGNATURE-FREEZE.md §5.1-④ + §5.2；增量 = ../iOS/docs/M5-SIGNATURE-FREEZE.md §2.3
# 回填：2026-11-12（M2）；2026-11-13（M5 增量：WDBadgeValue 新增 init(count:) / .dot，WDBadge 新增 init(value:)）
# B1 增量：2026-11-15（来源 = ../iOS/docs/B1-CONTRACT-CHANGE-REQUEST.md + Sources/WisdomUI/Components/Primitives/WDBadge/WDBadge.swift 公开签名）
# 说明：M0-5 的 contracts/README.md 尚未落库；本文件按三键登记（params / slots / default）+ 枚举全量 case。
# M5 增量只增不改：既有 init(label:) 与状态胶囊（24 高）不变；count 形态（20 高 / 最小宽 20）与 dot（7×7）是值形态。

component: WDBadge
params:
  - name: label
    ios: label
    type: Text
  - name: value            # M5 增量：WDBadgeValue（label / count / dot 三种值形态）
    ios: value
    type: WDBadgeValue
    default: null
  - name: variant          # B1 增量（2026-11-15）：状态胶囊六种语义变体；仅 init(label:variant:) 必填
    ios: variant           # 既有 init(label:) / init(value:) 保持无 variant（resolvedVariant = .shared）
    type: WDBadgeVariant
    default: .shared   # 既有重载的语义默认

slots: [label]

default: {}   # 既有 init(label:) 必填；value 为增量重载（默认 null）

enums:
  # B1 增量（2026-11-15）：六种状态变体（WDBadgeVariant.swift 全量 case；只增不改）
  WDBadgeVariant: [shared, schedule, pending, success, warning, danger]
