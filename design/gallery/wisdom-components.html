      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;div id=&quot;wd-gallery&quot;&gt;
&lt;style&gt;
#wd-gallery{
  /* 令牌：浅深成对，单元格用 color-scheme 切换 */
  --g-brand:#1677B3;
  --g-brand-strong:light-dark(#123F5C,#B0D5DF);
  --g-on-fill:light-dark(#0E3A55,#FFFFFF);
  --g-fill:linear-gradient(135deg,light-dark(#8FCFDD,#1677B3),light-dark(#63BAD2,#2A5CAA));
  --g-mid:linear-gradient(135deg,#4FB0C8,#1685A9);
  --g-mid-color:light-dark(#1685A9,#4FB0C8);
  --g-deep:linear-gradient(135deg,#065279,#1E3B7A);
  --g-surface:linear-gradient(135deg,light-dark(#B0D5DF,#123449),light-dark(#7EC4CF,#0F4055));
  --g-canvas:light-dark(#F1F8FA,#0A1B2A);
  --g-grouped:light-dark(#E8F2F7,#0D2334);
  --g-card:light-dark(rgba(255,255,255,.94),rgba(20,40,58,.82));
  --g-card-solid:light-dark(#FFFFFF,#0C2130);
  --g-sunken:light-dark(#EDF6F9,#0A1E2C);
  --g-text:light-dark(#0A1B24,#E6F1F6);
  --g-text2:light-dark(#3E5764,#A4BCCB);
  --g-text3:light-dark(#5B7784,#839EB0);
  --g-line:light-dark(rgba(10,27,36,.08),rgba(255,255,255,.10));
  --g-line2:light-dark(rgba(10,27,36,.16),rgba(255,255,255,.18));
  --g-field:light-dark(rgba(10,27,36,.05),rgba(255,255,255,.07));
  --g-glass:light-dark(rgba(255,255,255,.70),rgba(10,26,40,.55));
  --g-glass-strong:light-dark(rgba(255,255,255,.88),rgba(12,30,46,.78));
  --g-success:light-dark(#2A7F5C,#7FD3B4);
  --g-success-soft:light-dark(#E3F5EC,#0D2E24);
  --g-info:light-dark(#1677B3,#8FC4E8);
  --g-info-soft:light-dark(#E1F0F8,#0C2740);
  --g-warn:light-dark(#97651F,#EFC683);
  --g-warn-soft:light-dark(#FFF4DC,#33260E);
  --g-danger:light-dark(#B8564D,#EDA79E);
  --g-danger-soft:light-dark(#FBE7E4,#3A211E);
  --g-sh1:0 1px 2px light-dark(rgba(10,60,100,.04),rgba(0,0,0,.3)),0 6px 16px light-dark(rgba(10,60,100,.06),rgba(0,0,0,.34));
  --g-sh2:0 2px 6px light-dark(rgba(10,60,100,.06),rgba(0,0,0,.32)),0 14px 32px light-dark(rgba(10,60,100,.09),rgba(0,0,0,.42));
  --g-sh-brand:0 6px 16px light-dark(rgba(22,119,179,.18),rgba(0,0,0,.42));
  --g-r:16px;
  --g-r-md:12px;
  --g-r-sm:9px;
  display:block;
}
#wd-gallery .wd-light{color-scheme:light}
#wd-gallery .wd-dark{color-scheme:dark}
#wd-gallery [data-lucide]{width:16px;height:16px;flex:none}

/* ---------- 画廊骨架 ---------- */
#wd-gallery .gal-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
#wd-gallery .gal-kicker{font-weight:500;letter-spacing:.9px;text-transform:uppercase;color:var(--wd-text3)}
#wd-gallery .gal-title{margin:4px 0 0;color:var(--wd-text)}
#wd-gallery .gal-sub{margin-top:2px;color:var(--wd-text2)}
#wd-gallery .spec{margin-top:26px}
#wd-gallery .spec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
#wd-gallery .spec-id{font-variant-numeric:tabular-nums;color:var(--wd-text3);font-weight:500}
#wd-gallery .spec-name{margin:0;color:var(--wd-text)}
#wd-gallery .spec-tier{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--wd-card);border:1px solid var(--wd-border);color:var(--wd-text2)}
#wd-gallery .spec-desc{margin:4px 0 10px;color:var(--wd-text2)}
#wd-gallery .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#wd-gallery .cell{
  position:relative;background:var(--g-canvas);border:1px solid var(--g-line);
  border-radius:calc(var(--g-r) + 2px);padding:14px 14px 12px;color:var(--g-text);
  display:flex;flex-direction:column;gap:10px;overflow:hidden;
}
#wd-gallery .cell::before{
  content:attr(data-label);font-size:11px;font-weight:600;letter-spacing:.4px;
  color:var(--g-text3);text-transform:uppercase;
}
#wd-gallery .wd-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#wd-gallery .wd-k{font-size:11px;font-weight:600;color:var(--g-text3);width:34px;flex:none;letter-spacing:.2px}
#wd-gallery .wd-items{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:0}
#wd-gallery .wd-stack-v{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
#wd-gallery .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--wd-text2)}
#wd-gallery .acts b{font-weight:600;color:var(--wd-text)}
#wd-gallery .act{font-size:11px;color:var(--wd-text2)}
#wd-gallery .act em{font-style:normal;font-weight:600;color:var(--wd-text)}
#wd-gallery.mode-light .cell.wd-dark{display:none}
#wd-gallery.mode-dark .cell.wd-light{display:none}
#wd-gallery.mode-light .pair,#wd-gallery.mode-dark .pair{grid-template-columns:1fr}
@media (max-width:560px){#wd-gallery .pair{grid-template-columns:1fr}}

/* ---------- 组件 ---------- */
/* Button */
#wd-gallery .wd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid transparent;white-space:nowrap;font-family:inherit;transition:transform .16s cubic-bezier(.2,1.5,.5,1)}
#wd-gallery .wd-btn.sm{height:32px;padding:0 12px;font-size:13px}
#wd-gallery .wd-btn.lg{height:52px;padding:0 20px;font-size:16px}
#wd-gallery .wd-btn.filled{background:var(--g-fill);color:var(--g-on-fill);box-shadow:var(--g-sh-brand),inset 0 1px 0 rgba(255,255,255,.35)}
#wd-gallery .wd-btn.tonal{background:var(--g-surface);color:var(--g-brand-strong);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#wd-gallery .wd-btn.glass{background:var(--g-glass);color:var(--g-text);border-color:var(--g-line);box-shadow:var(--g-sh1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#wd-gallery .wd-btn.outline{background:transparent;border-color:var(--g-line2);color:var(--g-text)}
#wd-gallery .wd-btn.plain{background:transparent;color:var(--g-brand);padding:0 8px}
#wd-gallery .wd-btn.destructive{background:linear-gradient(135deg,#B8564D,#A94A42);color:#fff;box-shadow:0 6px 16px light-dark(rgba(184,86,77,.22),rgba(0,0,0,.45))}
#wd-gallery .wd-btn.pressed{transform:scale(.97);filter:brightness(.96)}
#wd-gallery .wd-btn[disabled]{opacity:.4}
#wd-gallery .wd-btn.focused{box-shadow:0 0 0 3px color-mix(in srgb,var(--g-brand) 32%,transparent)}
#wd-gallery .wd-spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;opacity:.85}

/* IconButton */
#wd-gallery .wd-ibtn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;color:var(--g-text);flex:none}
#wd-gallery .wd-ibtn.sm{width:32px;height:32px}
#wd-gallery .wd-ibtn.sq{border-radius:var(--g-r-sm)}
#wd-gallery .wd-ibtn.filled{background:var(--g-mid);color:#fff}
#wd-gallery .wd-ibtn.tonal{background:var(--g-surface);color:var(--g-brand-strong)}
#wd-gallery .wd-ibtn.glass{background:var(--g-glass-strong);border-color:var(--g-line);box-shadow:var(--g-sh1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#wd-gallery .wd-ibtn.outline{border-color:var(--g-line2)}

/* TextField / SearchField */
/* 高度固定 46，绝不设 flex：在纵向堆叠里 flex-basis:0 会让高度跟着内容变 */
#wd-gallery .wd-field{height:46px;box-sizing:border-box;border-radius:var(--g-r-md);background:light-dark(rgba(255,255,255,.92),rgba(16,36,54,.62));border:1.5px solid var(--g-line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;color:var(--g-text);min-width:0}
#wd-gallery .wd-items &gt; .wd-field{flex:1 1 170px}
#wd-gallery .wd-field.inset{background:var(--g-field);border-color:transparent}
#wd-gallery .wd-field.outline{background:transparent;border-color:var(--g-line2)}
#wd-gallery .wd-field.glass{background:var(--g-glass-strong);border-color:var(--g-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#wd-gallery .wd-field.on{border-color:color-mix(in srgb,var(--g-brand) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--g-brand) 18%,transparent)}
#wd-gallery .wd-field.err{border-color:var(--g-danger)}
#wd-gallery .wd-field.off{opacity:.45}
#wd-gallery .wd-field.pill{border-radius:999px}
#wd-gallery .wd-field input{border:0;background:transparent;font:inherit;color:inherit;width:100%;min-width:0;outline:none}
#wd-gallery .wd-field input::placeholder{color:var(--g-text3)}
#wd-gallery .wd-field [data-lucide]{color:var(--g-text3)}
#wd-gallery .wd-field .suffix{color:var(--g-text3);display:inline-grid;place-items:center}
#wd-gallery .wd-field .unit{color:var(--g-text2);font-size:14px;white-space:nowrap;padding-left:2px}
#wd-gallery .wd-field .suffix-sep{width:1px;height:20px;background:var(--g-line);flex:none}
#wd-gallery .wd-field .counter{color:var(--g-text3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#wd-gallery .wd-hint{font-size:12px;color:var(--g-text2)}
#wd-gallery .wd-hint.err{color:var(--g-danger)}

/* Switch */
#wd-gallery .wd-switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:light-dark(rgba(10,27,36,.14),rgba(255,255,255,.16));position:relative;flex:none;border:0;margin:0;transition:background .26s}
#wd-gallery .wd-switch::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(8,40,90,.22);transition:transform .3s cubic-bezier(.2,1.5,.45,1)}
#wd-gallery .wd-switch:checked{background:var(--g-mid)}
#wd-gallery .wd-switch:checked::after{transform:translateX(20px)}
#wd-gallery .wd-switch[disabled]{opacity:.4}
#wd-gallery .wd-switchrow{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;min-width:0}
#wd-gallery .wd-switchrow .t{font-size:15px;color:var(--g-text);min-width:0}
#wd-gallery .wd-switchrow .d{font-size:12px;color:var(--g-text2)}

/* Checkbox / Radio */
#wd-gallery .wd-check{appearance:none;-webkit-appearance:none;position:relative;width:26px;height:26px;border-radius:var(--g-r-sm);border:1.5px solid var(--g-line2);background:var(--g-field);flex:none;margin:0;transition:background .22s,transform .2s cubic-bezier(.2,1.5,.5,1)}
#wd-gallery .wd-check::after{content:&quot;&quot;;position:absolute;inset:0;margin:auto;width:5px;height:10px;border-right:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:rotate(42deg) translate(-1px,-1px) scale(.3);opacity:0;transition:transform .26s cubic-bezier(.2,1.6,.5,1),opacity .14s}
#wd-gallery .wd-check:checked{background:var(--g-mid);border-color:transparent}
#wd-gallery .wd-check:checked::after{opacity:1;transform:rotate(42deg) translate(-1px,-1px) scale(1)}
#wd-gallery .wd-check:indeterminate{background:var(--g-mid);border-color:transparent}
#wd-gallery .wd-check:indeterminate::after{opacity:1;width:12px;height:0;border-right:0;border-bottom:2.4px solid #fff;transform:rotate(0) scale(1)}
#wd-gallery .wd-check:active{transform:scale(.9)}
#wd-gallery .wd-check[disabled]{opacity:.4}
#wd-gallery .wd-radio{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g-line2);background:var(--g-field);flex:none;margin:0;position:relative}
#wd-gallery .wd-radio::after{content:&quot;&quot;;position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:#fff;transform:scale(.2);opacity:0;transition:transform .2s cubic-bezier(.2,1.5,.5,1),opacity .14s}
#wd-gallery .wd-radio:checked{background:var(--g-mid);border-color:transparent}
#wd-gallery .wd-radio:checked::after{opacity:1;transform:scale(1)}
#wd-gallery .wd-checkrow{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--g-text)}

/* Slider / Stepper */
#wd-gallery .wd-slider{appearance:none;-webkit-appearance:none;width:100%;min-width:120px;height:6px;border-radius:999px;margin:0;
  background:linear-gradient(90deg,var(--g-mid-color) 0 var(--fill,50%),light-dark(#DCEBF1,#1C3B52) var(--fill,50%) 100%)}
#wd-gallery .wd-slider::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--g-line);box-shadow:0 2px 8px rgba(8,40,90,.26)}
#wd-gallery .wd-stepper{display:inline-flex;align-items:center;background:var(--g-glass-strong);border:1px solid var(--g-line);border-radius:999px;overflow:hidden}
#wd-gallery .wd-stepper button{border:0;background:transparent;font:inherit;font-size:18px;color:var(--g-brand);width:40px;height:36px}
#wd-gallery .wd-stepper span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g-text);min-width:26px;text-align:center}
#wd-gallery .wd-stepper.compact button{width:32px;height:30px;font-size:16px}

/* Chip / Badge */
#wd-gallery .wd-chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:light-dark(rgba(255,255,255,.9),rgba(16,36,54,.6));color:var(--g-text2);border:1px solid var(--g-line)}
#wd-gallery .wd-chip.on{background:var(--g-surface);color:var(--g-brand-strong);font-weight:600;border-color:color-mix(in srgb,var(--g-brand) 42%,transparent)}
#wd-gallery .wd-chip.out{background:transparent;border-color:var(--g-line2);color:var(--g-text)}
#wd-gallery .wd-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
#wd-gallery .wd-badge.b{background:var(--g-surface);color:var(--g-brand-strong)}
#wd-gallery .wd-badge.deep{background:var(--g-mid);color:#fff}
#wd-gallery .wd-badge.g{background:var(--g-glass-strong);color:var(--g-brand);border-color:var(--g-line)}
#wd-gallery .wd-badge.ok{background:var(--g-success-soft);color:var(--g-success)}
#wd-gallery .wd-badge.warn{background:var(--g-warn-soft);color:var(--g-warn)}
#wd-gallery .wd-badge.d{background:var(--g-danger-soft);color:var(--g-danger)}
#wd-gallery .wd-dot{width:7px;height:7px;border-radius:50%;background:var(--g-brand);display:inline-block}
#wd-gallery .wd-dot.ok{background:var(--g-success)}
#wd-gallery .wd-dot.warn{background:var(--g-warn)}
#wd-gallery .wd-dot.d{background:var(--g-danger)}
#wd-gallery .wd-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--g-danger);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
#wd-gallery .wd-count.mid{background:var(--g-brand)}

/* Avatar */
#wd-gallery .wd-av{border-radius:50%;display:inline-grid;place-items:center;font-weight:600;flex:none;box-sizing:border-box;border:2px solid light-dark(rgba(255,255,255,.9),rgba(8,26,44,.9))}
#wd-gallery .wd-av.a1{background:linear-gradient(135deg,#C9E4EB,#B0D5DF);color:#123F5C}
#wd-gallery .wd-av.a2{background:linear-gradient(135deg,#A3D6E0,#7EC4CF);color:#123F5C}
#wd-gallery .wd-av.a3{background:linear-gradient(135deg,#1B7FA8,#1677B3);color:#fff}
#wd-gallery .wd-av.a4{background:linear-gradient(135deg,#1677B3,#065279);color:#fff}
#wd-gallery .wd-av.xs{width:20px;height:20px;font-size:9px}
#wd-gallery .wd-av.sm{width:28px;height:28px;font-size:11px}
#wd-gallery .wd-av.md{width:32px;height:32px;font-size:12px}
#wd-gallery .wd-av.lg{width:40px;height:40px;font-size:14px}
#wd-gallery .wd-av.xl{width:56px;height:56px;font-size:18px}
#wd-gallery .wd-avstack{display:inline-flex;align-items:center}
#wd-gallery .wd-avstack .wd-av+.wd-av{margin-left:-9px}
#wd-gallery .wd-avstack .more{background:var(--g-glass-strong);color:var(--g-text2);font-size:10px;border-color:light-dark(rgba(255,255,255,.9),rgba(8,26,44,.9))}
#wd-gallery .wd-avwrap{position:relative;display:inline-grid}
#wd-gallery .wd-avwrap .on-dot{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--g-success);border:2px solid light-dark(#FFFFFF,#0C2130)}

/* Divider */
#wd-gallery .wd-div{height:1px;background:var(--g-line);width:100%}
#wd-gallery .wd-div.inset{margin-left:34px;width:calc(100% - 34px)}

/* Progress */
#wd-gallery .wd-track{height:6px;border-radius:999px;background:color-mix(in srgb,#B0D5DF 55%,transparent);overflow:hidden;width:100%;min-width:100px}
#wd-gallery .wd-track i{display:block;height:100%;border-radius:999px;background:var(--g-mid)}
#wd-gallery .wd-track.seg{display:flex;gap:2px;background:transparent;overflow:visible}
#wd-gallery .wd-track.seg i{background:var(--g-line2);flex:1}
#wd-gallery .wd-track.seg i.on{background:var(--g-mid)}
#wd-gallery .wd-ring{--p:60;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(from -90deg,var(--g-brand) 0 calc(var(--p)*1%),color-mix(in srgb,#B0D5DF 55%,transparent) calc(var(--p)*1%) 100%)}
#wd-gallery .wd-ring i{width:46px;height:46px;border-radius:50%;background:var(--g-card-solid);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--g-text)}

/* Card */
#wd-gallery .wd-card{position:relative;background:var(--g-card);border:1px solid var(--g-line);border-radius:var(--g-r);box-shadow:var(--g-sh1);padding:14px;color:var(--g-text);min-width:0}
#wd-gallery .wd-card.glass{background:var(--g-glass-strong);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--g-sh1)}
#wd-gallery .wd-card.outline{background:transparent;box-shadow:none}
#wd-gallery .wd-card.sunken{background:var(--g-sunken);box-shadow:none}
#wd-gallery .wd-card.media{padding:0;overflow:hidden}
#wd-gallery .wd-card.media .thumb{height:76px;background:var(--g-surface)}
#wd-gallery .wd-card.media .bd{padding:12px 14px}
#wd-gallery .wd-card-title{font-size:16px;font-weight:600}
#wd-gallery .wd-card-sub{font-size:13px;color:var(--g-text2);margin-top:2px}
#wd-gallery .wd-card-body{margin-top:8px;font-size:14px;color:var(--g-text2)}

/* ListRow / ListSection */
#wd-gallery .wd-list{background:var(--g-card);border:1px solid var(--g-line);border-radius:var(--g-r);box-shadow:var(--g-sh1);overflow:hidden;width:100%}
#wd-gallery .wd-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--g-line);min-width:0}
#wd-gallery .wd-item:first-child{border-top:0}
#wd-gallery .wd-item.sel{background:color-mix(in srgb,var(--g-brand) 7%,transparent);box-shadow:inset 3px 0 0 var(--g-brand)}
#wd-gallery .wd-ico{width:34px;height:34px;border-radius:var(--g-r-sm);background:var(--g-surface);color:var(--g-brand-strong);display:grid;place-items:center;flex:none}
#wd-gallery .wd-ico.deep{background:var(--g-mid);color:#fff}
#wd-gallery .wd-ico [data-lucide]{width:18px;height:18px}
#wd-gallery .wd-item-t{flex:1;min-width:0}
#wd-gallery .wd-item-t b{display:block;font-size:15px;font-weight:500;color:var(--g-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wd-gallery .wd-item-t span{font-size:12px;color:var(--g-text2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wd-gallery .wd-chev{color:var(--g-text3);flex:none}
#wd-gallery .wd-sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px;width:100%}
#wd-gallery .wd-sechead b{font-size:13px;font-weight:600;color:var(--g-text2);letter-spacing:.3px}
#wd-gallery .wd-sechead span{font-size:13px;color:var(--g-brand);font-weight:500}
#wd-gallery .wd-group{display:flex;flex-direction:column;gap:8px;width:100%}

/* Feedback */
#wd-gallery .wd-banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--g-r-md);font-size:13px;line-height:1.4;border:1px solid transparent;width:100%}
#wd-gallery .wd-banner [data-lucide]{width:18px;height:18px;margin-top:1px}
#wd-gallery .wd-banner.ok{background:linear-gradient(135deg,color-mix(in srgb,var(--g-success) 22%,transparent),color-mix(in srgb,var(--g-success) 12%,transparent));border-color:color-mix(in srgb,var(--g-success) 28%,transparent);color:var(--g-success)}
#wd-gallery .wd-banner.warn{background:linear-gradient(135deg,color-mix(in srgb,var(--g-warn) 22%,transparent),color-mix(in srgb,var(--g-warn) 12%,transparent));border-color:color-mix(in srgb,var(--g-warn) 28%,transparent);color:var(--g-warn)}
#wd-gallery .wd-banner.bad{background:linear-gradient(135deg,color-mix(in srgb,var(--g-danger) 20%,transparent),color-mix(in srgb,var(--g-danger) 11%,transparent));border-color:color-mix(in srgb,var(--g-danger) 26%,transparent);color:var(--g-danger);font-weight:600}
#wd-gallery .wd-toast{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;background:var(--g-glass-strong);border:1px solid var(--g-line);box-shadow:var(--g-sh2);font-size:14px;color:var(--g-text)}
#wd-gallery .wd-toast [data-lucide]{color:var(--g-brand)}
#wd-gallery .wd-skel{height:11px;border-radius:6px;background:linear-gradient(100deg,var(--g-field) 30%,color-mix(in srgb,#7EC4CF 30%,transparent) 50%,var(--g-field) 70%);background-size:220% 100%;animation:galShimmer 2.2s linear infinite}
#wd-gallery .wd-skel.w70{width:70%}
#wd-gallery .wd-skel.w45{width:45%}
@keyframes galShimmer{0%{background-position:-120% 0}100%{background-position:220% 0}}

/* 左滑删除：直接展示滑开后的结果状态，不做位移，避免窄容器里内容被裁掉 */
#wd-gallery .wd-swipe{position:relative;display:flex;align-items:stretch;border-radius:var(--g-r-md);overflow:hidden;border:1px solid var(--g-line);width:100%;background:var(--g-card)}
#wd-gallery .wd-swipe .del{flex:none;width:var(--del,86px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(135deg,#B8564D,#A94A42);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:0 6px}
#wd-gallery .wd-swipe .del [data-lucide]{width:18px;height:18px}
#wd-gallery .wd-swipe .body{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--g-card)}
#wd-gallery .wd-swipe.armed .del{flex:1 1 auto;width:auto}
#wd-gallery .wd-swipe .body .wd-item-t{flex:1;min-width:0}
#wd-gallery .wd-swipe .body .wd-item-t b{display:block;font-size:15px;font-weight:500;color:var(--g-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wd-gallery .wd-swipe .body .wd-item-t span{font-size:12px;color:var(--g-text2)}
#wd-gallery .wd-swipe .del [data-lucide]{width:18px;height:18px}
#wd-gallery .wd-swipe.armed .del{width:120px}
#wd-gallery .wd-hintbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g-text2)}
#wd-gallery .wd-hintbar [data-lucide]{width:14px;height:14px}
#wd-gallery .wd-multibar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:var(--g-r-md);background:var(--g-glass-strong);border:1px solid var(--g-line);box-shadow:var(--g-sh1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);width:100%}
#wd-gallery .wd-multibar .n{font-size:14px;font-weight:600;color:var(--g-text);font-variant-numeric:tabular-nums}

/* Segmented / Picker / DatePicker */
#wd-gallery .wd-seg{display:inline-flex;background:light-dark(rgba(255,255,255,.88),rgba(16,36,54,.6));border:1px solid var(--g-line);border-radius:999px;padding:3px;gap:2px}
#wd-gallery .wd-seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--g-text2);padding:6px 14px;border-radius:999px}
#wd-gallery .wd-seg button[aria-pressed=&quot;true&quot;]{background:var(--g-card-solid);color:var(--g-text);font-weight:600;box-shadow:var(--g-sh1)}
#wd-gallery .wd-menu{background:var(--g-card-solid);border:1px solid var(--g-line);border-radius:var(--g-r-md);box-shadow:var(--g-sh2);padding:6px;min-width:150px}
#wd-gallery .wd-menu div{padding:8px 10px;border-radius:8px;font-size:14px;color:var(--g-text);display:flex;align-items:center;gap:8px}
#wd-gallery .wd-menu div.sel{background:color-mix(in srgb,var(--g-brand) 10%,transparent);color:var(--g-brand);font-weight:600}

/* Navigation / TabBar / Toolbar / FAB */
#wd-gallery .wd-navbar{width:100%;background:var(--g-glass-strong);border:1px solid var(--g-line);border-radius:var(--g-r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--g-sh1);overflow:hidden}
#wd-gallery .wd-navbar .bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
#wd-gallery .wd-navbar .big{padding:2px 14px 12px;font-size:28px;font-weight:700;letter-spacing:-.3px;color:var(--g-text)}
#wd-gallery .wd-navbar .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--g-glass-strong);border:1px solid var(--g-line);color:var(--g-text)}
#wd-gallery .wd-navbar .ttl{flex:1;font-size:17px;font-weight:600;color:var(--g-text)}
#wd-gallery .wd-tabbar{display:flex;align-items:center;justify-content:space-around;height:58px;padding:0 6px;border-radius:999px;background:var(--g-glass-strong);border:1px solid var(--g-line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),var(--g-sh2);width:100%}
#wd-gallery .wd-tabbar .it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--g-text3);padding:0 8px}
#wd-gallery .wd-tabbar .it.on{color:var(--g-brand)}
#wd-gallery .wd-tabbar .it.on .dot{width:4px;height:4px;border-radius:50%;background:var(--g-brand)}
#wd-gallery .wd-fab{width:56px;height:56px;border-radius:19px;background:var(--g-fill);color:var(--g-on-fill);display:grid;place-items:center;box-shadow:var(--g-sh-brand),var(--g-sh2)}
#wd-gallery .wd-fab [data-lucide]{width:24px;height:24px}
#wd-gallery .wd-toolbar{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--g-glass-strong);border:1px solid var(--g-line);box-shadow:var(--g-sh1);width:fit-content}
#wd-gallery .wd-toolbar .tb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--g-text)}
#wd-gallery .wd-toolbar .tb.on{background:var(--g-mid);color:#fff}

/* Sheet / Alert / ActionSheet */
#wd-gallery .wd-sheet{width:100%;background:var(--g-card-solid);border:1px solid var(--g-line);border-radius:var(--g-r) var(--g-r) 12px 12px;box-shadow:var(--g-sh2);padding:10px 14px 14px;color:var(--g-text)}
#wd-gallery .wd-sheet .grab{width:36px;height:5px;border-radius:999px;background:light-dark(#BFD6CB,#3A4E5C);margin:0 auto 10px}
#wd-gallery .wd-sheet h4{margin:0 0 4px;font-size:17px;font-weight:600}
#wd-gallery .wd-sheet p{margin:0;font-size:14px;color:var(--g-text2)}
#wd-gallery .wd-alert{width:100%;max-width:270px;background:var(--g-card-solid);border:1px solid var(--g-line);border-radius:var(--g-r);box-shadow:var(--g-sh2);overflow:hidden;text-align:center;color:var(--g-text)}
#wd-gallery .wd-alert .hd{padding:16px 16px 6px;font-size:17px;font-weight:600}
#wd-gallery .wd-alert .bd{padding:0 16px 14px;font-size:13px;color:var(--g-text2);line-height:1.45}
#wd-gallery .wd-alert .ft{display:flex;border-top:1px solid var(--g-line)}
#wd-gallery .wd-alert .ft button{flex:1;border:0;background:transparent;font:inherit;font-size:16px;padding:12px 0;color:var(--g-brand)}
#wd-gallery .wd-alert .ft button+button{border-left:1px solid var(--g-line)}
#wd-gallery .wd-alert .ft button.danger{color:var(--g-danger)}
#wd-gallery .wd-actions{width:100%;background:var(--g-card-solid);border:1px solid var(--g-line);border-radius:var(--g-r);box-shadow:var(--g-sh2);overflow:hidden;color:var(--g-text)}
#wd-gallery .wd-actions div{padding:13px 16px;font-size:16px;text-align:center;border-top:1px solid var(--g-line)}
#wd-gallery .wd-actions div:first-child{border-top:0}
#wd-gallery .wd-actions div.danger{color:var(--g-danger)}
#wd-gallery .wd-actions div.cancel{font-weight:600;background:var(--g-sunken)}

/* EmptyState */
#wd-gallery .wd-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 12px;width:100%}
#wd-gallery .wd-empty .badge-wrap{width:56px;height:56px;border-radius:50%;background:var(--g-surface);display:grid;place-items:center;color:var(--g-brand-strong)}
#wd-gallery .wd-empty .badge-wrap [data-lucide]{width:26px;height:26px}
#wd-gallery .wd-empty b{font-size:16px;font-weight:600;color:var(--g-text)}
#wd-gallery .wd-empty span{font-size:13px;color:var(--g-text2);max-width:32ch}

/* Patterns */
#wd-gallery .wd-task{display:flex;align-items:center;gap:11px;background:var(--g-card);border:1px solid var(--g-line);border-radius:var(--g-r-md);box-shadow:0 1px 2px light-dark(rgba(10,60,100,.045),rgba(0,0,0,.3));padding:11px 12px;width:100%;min-width:0}
#wd-gallery .wd-task .txt{flex:1;min-width:0}
#wd-gallery .wd-task .txt b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--g-text)}
#wd-gallery .wd-task .txt span{font-size:12px;color:var(--g-text2)}
#wd-gallery .wd-task.done .txt b{color:var(--g-text3);text-decoration:line-through}
#wd-gallery .wd-time{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--g-brand) 16%,transparent);color:var(--g-brand-strong);white-space:nowrap}
#wd-gallery .wd-time.warn{background:var(--g-warn-soft);color:var(--g-warn)}
#wd-gallery .wd-time.late{background:var(--g-danger-soft);color:var(--g-danger)}
#wd-gallery .wd-streak{display:inline-grid;place-items:center;gap:2px}
#wd-gallery .wd-streak .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--g-text)}
#wd-gallery .wd-streak .l{font-size:11px;color:var(--g-text2)}

/* 不确定进度 */
#wd-gallery .wd-track.indet i{width:35%;animation:galIndet 1.4s ease-in-out infinite}
@keyframes galIndet{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){
  #wd-gallery .wd-track.indet i{animation:none;width:60%;transform:none}
  #wd-gallery .wd-skel{animation:none}
}

&lt;!-- 03 TextField --&gt;

      &lt;/div&gt;&lt;/div&gt;

(function () {

  root.querySelectorAll(&quot;[data-clone]&quot;).forEach(function (target) {
    var source = target.previousElementSibling;
    if (!source) return;
    Array.prototype.slice.call(source.children).forEach(function (node) {
      var copy = node.cloneNode(true);
      // 必须在插入文档之前改名单选按钮：插入后同名会短暂成组，
      // 浏览器会把浅色列那一份取消选中
      copy.querySelectorAll(&#x27;input[type=&quot;radio&quot;][name]&#x27;).forEach(function (el) {
        el.name = el.name + &quot;-dark&quot;;
      });
      target.appendChild(copy);
    });
  });

  var half = root.querySelector(&quot;#wd-gal-half&quot;);
  if (half) {
    half.indeterminate = true;
    half.addEventListener(&quot;click&quot;, function (e) { e.preventDefault(); });

  var mode = root.querySelector(&quot;#wd-gal-mode&quot;);

  }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {

    }
    if (ids.size === 0) {

    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }

    clearOpenTimeout();
    pinnedByTouch = false;

    autoUpdateCleanup?.();

    activeTrigger = null;
    tooltip?.remove();

    }

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

      pendingTrigger = null;
      openTooltip(trigger);
