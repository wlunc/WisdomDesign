          &lt;div class=&quot;bd&quot;&gt;&lt;label class=&quot;wd-field on&quot;&gt;&lt;input type=&quot;text&quot; value=&quot;本周家务&quot; aria-label=&quot;清单名称&quot;&gt;&lt;/label&gt;&lt;/div&gt;
          &lt;div class=&quot;ft&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot;&gt;保存&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;点击遮罩&lt;/em&gt; → 不关闭，Alert 的前提就是必须选择&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;点击确认&lt;/em&gt; → 立即禁用按钮，防止重复提交&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;Esc / 返回&lt;/em&gt; → 等价于取消&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 26 BottomSheet --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;26&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;BottomSheet&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P0&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;承接次级内容，不离开当前上下文。顶部圆角 32，底部贴合屏幕。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;stage sheet&quot; style=&quot;min-height:220px&quot;&gt;
        &lt;div class=&quot;wd-sheet&quot;&gt;
          &lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;hd&quot;&gt;&lt;b&gt;新建任务&lt;/b&gt;&lt;span&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;wd-stack-v&quot;&gt;
            &lt;label class=&quot;wd-field&quot;&gt;&lt;input type=&quot;text&quot; value=&quot;整理储物间&quot; aria-label=&quot;任务名称&quot;&gt;&lt;/label&gt;
            &lt;div class=&quot;wd-pickrow&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;指派给&lt;/span&gt;&lt;span class=&quot;val&quot;&gt;&lt;span class=&quot;wd-avstack&quot;&gt;&lt;span class=&quot;wd-av a1 sm&quot;&gt;我&lt;/span&gt;&lt;span class=&quot;wd-av a2 sm&quot;&gt;妈&lt;/span&gt;&lt;/span&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;ft&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;wd-btn outline cursor-interaction&quot;&gt;取消&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;wd-btn filled cursor-interaction&quot;&gt;创建&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;下拉&lt;/em&gt; → 内容可滚动时先滚内容，到顶后继续下拉才拖面板&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;松手&lt;/em&gt; → 速度 ≥500pt/s 或位移超 40% 时关闭，否则回弹&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;有未保存修改&lt;/em&gt; → 关闭前先弹 Alert 确认&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 27 ActionSheet --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;27&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;ActionSheet&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;一组与当前位置强相关的操作。取消独立成胶囊，不和操作混在一起。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;stage&quot; style=&quot;align-items:stretch&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;wd-actions&quot;&gt;
            &lt;div class=&quot;ttl&quot;&gt;整理储物间&lt;/div&gt;
            &lt;div class=&quot;row&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;标记为已完成&lt;/div&gt;
            &lt;div class=&quot;row&quot;&gt;&lt;i data-lucide=&quot;calendar&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;改到明天&lt;/div&gt;
            &lt;div class=&quot;row&quot;&gt;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;改派给妈妈&lt;/div&gt;
            &lt;div class=&quot;row danger&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;删除任务&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;wd-cancel&quot;&gt;取消&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;点击某行&lt;/em&gt; → 执行并关闭&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;点击遮罩 / 返回&lt;/em&gt; → 等价于取消&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;破坏性操作&lt;/em&gt; → 始终在最下方，不夹在中间&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 28 Toast --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;28&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;Toast&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P0&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;非阻塞轻提示。它会自己消失，所以承载的信息必须是&quot;不看也没关系&quot;的。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;wd-stack-v&quot; style=&quot;align-items:flex-start;gap:10px&quot;&gt;
        &lt;span class=&quot;wd-toast&quot;&gt;&lt;i data-lucide=&quot;check&quot; class=&quot;lead&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;任务已保存&lt;/span&gt;
        &lt;span class=&quot;wd-toast&quot;&gt;&lt;i data-lucide=&quot;info&quot; class=&quot;lead&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;已复制到剪贴板&lt;/span&gt;
        &lt;span class=&quot;wd-toast&quot;&gt;&lt;i data-lucide=&quot;x-circle&quot; class=&quot;lead bad&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;同步失败，请重试&lt;/span&gt;
        &lt;span class=&quot;wd-toast&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; class=&quot;lead bad&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;任务已删除&lt;span class=&quot;undo&quot;&gt;撤销&lt;/span&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;时长&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;span class=&quot;wd-hint&quot;&gt;纯提示 3 秒 ｜ 带操作 5 秒 ｜ 手指悬停暂停计时&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;出现&lt;/em&gt; → 320ms 上移淡入，不抢焦点&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;新提示到来&lt;/em&gt; → 顶掉旧的那条，不排队&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;点击页面其它区域&lt;/em&gt; → 不关闭，等它自己消失&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 29 Banner --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;29&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;Banner&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P0&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;常驻的页面级提示。它不自动消失，所以必须值得占一块常驻空间。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;wd-stack-v&quot;&gt;
        &lt;div class=&quot;wd-banner ok&quot;&gt;&lt;i data-lucide=&quot;check-circle-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;body&quot;&gt;已同步给全家 4 位成员&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wd-banner info&quot;&gt;&lt;i data-lucide=&quot;info&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;body&quot;&gt;试用期还剩 12 天&lt;/span&gt;&lt;span class=&quot;op&quot;&gt;升级&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wd-banner warn&quot;&gt;&lt;i data-lucide=&quot;alert-triangle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;body&quot;&gt;有 2 项今天到期还没完成&lt;/span&gt;&lt;span class=&quot;op&quot;&gt;去看看&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;wd-banner bad&quot;&gt;&lt;i data-lucide=&quot;x-circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;body&quot;&gt;网络不可用，改动已暂存本地&lt;/span&gt;&lt;span class=&quot;op&quot;&gt;重试&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;规则&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;span class=&quot;wd-hint&quot;&gt;同页最多 2 条，按严重度排序：错误 → 警示 → 信息&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;常驻&lt;/em&gt; → 直到条件解除才消失，不做循环动画&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;可关闭&lt;/em&gt; → 关闭后本次会话不再出现&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;读屏&lt;/em&gt; → 错误用 alert，信息用 status&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 30 EmptyState --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;30&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;EmptyState&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;没有内容时，说明为什么没有，以及接下来能做什么。四种变体只有文案不同。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;首次空&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;div class=&quot;wd-empty&quot;&gt;
        &lt;span class=&quot;ic&quot;&gt;&lt;i data-lucide=&quot;list-checks&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
        &lt;b&gt;还没有任务&lt;/b&gt;&lt;span&gt;新建一个，从今天开始。&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;wd-btn filled sm cursor-interaction&quot;&gt;新建第一个任务&lt;/button&gt;
      &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;无结果&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;div class=&quot;wd-empty&quot;&gt;
        &lt;span class=&quot;ic&quot;&gt;&lt;i data-lucide=&quot;search-x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
        &lt;b&gt;没找到&quot;储物间&quot;&lt;/b&gt;&lt;span&gt;换个词试试，或清除筛选条件。&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;wd-btn tonal sm cursor-interaction&quot;&gt;清除筛选&lt;/button&gt;
      &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;受限 / 失败&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;div class=&quot;wd-empty&quot;&gt;
        &lt;span class=&quot;ic&quot;&gt;&lt;i data-lucide=&quot;bell-off&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
        &lt;b&gt;需要通知权限&lt;/b&gt;&lt;span&gt;开启后才能收到提醒。&lt;/span&gt;
        &lt;button type=&quot;button&quot; class=&quot;wd-btn tonal sm cursor-interaction&quot;&gt;去设置&lt;/button&gt;
      &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;位置&lt;/em&gt; → 在内容区内居中，不是屏幕正中&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;动画&lt;/em&gt; → 不做入场动画，用户此时已经受挫&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;无结果&lt;/em&gt; → 标题里带上搜索关键词&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 31 Skeleton --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;31&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;Skeleton&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;加载占位。形状必须和真实内容一致，否则比没有骨架更糟。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;文本&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;div class=&quot;wd-skel line&quot; style=&quot;width:100%&quot;&gt;&lt;span class=&quot;wd-skel w70&quot;&gt;&lt;/span&gt;&lt;span class=&quot;wd-skel w45&quot;&gt;&lt;/span&gt;&lt;span class=&quot;wd-skel w70&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;列表&lt;/span&gt;&lt;div class=&quot;wd-items&quot; style=&quot;width:100%&quot;&gt;&lt;div class=&quot;wd-skel line&quot; style=&quot;width:100%&quot;&gt;
        &lt;span style=&quot;display:flex;gap:12px;align-items:center&quot;&gt;&lt;span class=&quot;wd-skel av&quot;&gt;&lt;/span&gt;&lt;span style=&quot;flex:1;display:flex;flex-direction:column;gap:6px&quot;&gt;&lt;span class=&quot;wd-skel w70&quot;&gt;&lt;/span&gt;&lt;span class=&quot;wd-skel w45&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
        &lt;span style=&quot;display:flex;gap:12px;align-items:center&quot;&gt;&lt;span class=&quot;wd-skel av&quot;&gt;&lt;/span&gt;&lt;span style=&quot;flex:1;display:flex;flex-direction:column;gap:6px&quot;&gt;&lt;span class=&quot;wd-skel w70&quot;&gt;&lt;/span&gt;&lt;span class=&quot;wd-skel w45&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
        &lt;span style=&quot;display:flex;gap:12px;align-items:center&quot;&gt;&lt;span class=&quot;wd-skel av&quot;&gt;&lt;/span&gt;&lt;span style=&quot;flex:1;display:flex;flex-direction:column;gap:6px&quot;&gt;&lt;span class=&quot;wd-skel w70&quot;&gt;&lt;/span&gt;&lt;span class=&quot;wd-skel w45&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
      &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;替换&lt;/em&gt; → 加载完成后整块替换，不逐块闪烁，且无布局跳动&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;数量&lt;/em&gt; → 列表渲染 5–6 行，不是全量&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;减弱动态效果&lt;/em&gt; → 停止微光，显示静态灰块&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 32 PullToRefresh --&gt;
&lt;section class=&quot;spec&quot;&gt;
  &lt;div class=&quot;spec-head&quot;&gt;&lt;span class=&quot;spec-id&quot;&gt;32&lt;/span&gt;&lt;h2 class=&quot;spec-name&quot;&gt;PullToRefresh&lt;/h2&gt;&lt;span class=&quot;spec-tier&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
  &lt;p class=&quot;spec-desc text-small&quot;&gt;主动刷新。指示器覆盖在列表上方，不下推内容。&lt;/p&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;cell wd-light&quot; data-label=&quot;浅色&quot;&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;三态&lt;/span&gt;&lt;div class=&quot;wd-items&quot; style=&quot;gap:22px&quot;&gt;
        &lt;span class=&quot;wd-ptr&quot;&gt;&lt;span class=&quot;ring&quot; style=&quot;border-top-color:var(--g-line2)&quot;&gt;&lt;/span&gt;下拉刷新&lt;/span&gt;
        &lt;span class=&quot;wd-ptr&quot;&gt;&lt;span class=&quot;ring&quot;&gt;&lt;/span&gt;松开刷新&lt;/span&gt;
        &lt;span class=&quot;wd-ptr spin&quot;&gt;&lt;span class=&quot;ring&quot;&gt;&lt;/span&gt;正在刷新&lt;/span&gt;
      &lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;wd-row&quot;&gt;&lt;span class=&quot;wd-k&quot;&gt;阈值&lt;/span&gt;&lt;div class=&quot;wd-items&quot;&gt;&lt;span class=&quot;wd-hint&quot;&gt;下拉 64 触发，最大 120；阈值处在触觉上震一次，只触发一次&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;cell wd-dark&quot; data-label=&quot;深色&quot; data-clone&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;acts&quot;&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;下拉中&lt;/em&gt; → 阻力递增，环跟着下拉距离画出&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;刷新中再次下拉&lt;/em&gt; → 不响应&lt;/span&gt;&lt;span class=&quot;act&quot;&gt;&lt;em&gt;超时 10 秒&lt;/em&gt; → 收起并用 Toast 提示失败&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 33 NavigationBar --&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
