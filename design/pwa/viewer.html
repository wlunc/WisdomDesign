<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wisdom Design</title>
<meta name="description" content="Wisdom Design System 规格画廊。">
<meta name="theme-color" content="#f1f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1b2a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wisdom">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="./assets/app.css">
<script src="./assets/app.js" defer></script>
</head>
<body class="viewer">
<header class="viewer-bar">
  <div class="viewer-bar__inner">
    <a class="icon-btn" id="viewer-back" href="./" aria-label="返回目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="viewer-title">
      <b id="viewer-title">画廊</b>
      <span id="viewer-subtitle">正在载入…</span>
    </div>
    <div class="segmented" id="mode-toggle" role="group" aria-label="显示模式">
      <button type="button" data-mode="light" aria-pressed="true" aria-label="只看浅色">浅</button>
      <button type="button" data-mode="dark" aria-pressed="false" aria-label="只看深色">深</button>
      <button type="button" data-mode="pair" aria-pressed="false" aria-label="浅深并排">并</button>
    </div>
    <button class="icon-btn" type="button" id="viewer-share" aria-label="分享当前页面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
    </button>
  </div>
</header>

<main class="viewer-main">
  <div class="viewer-loading" id="viewer-loading"><span class="spinner" aria-label="载入中"></span></div>
  <iframe id="doc-frame" title="设计稿" loading="eager"></iframe>
  <div class="viewer-error" id="viewer-error" hidden>画廊没有载入，请返回目录重试。</div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
