:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

  font-weight: var(--font-weight-medium);

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

.table-responsive {

  overflow-x: auto;

}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

  min-width: 0;
  align-items: center;
  gap: 4px;
}

  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

.progress-bar:only-child {

}

.progress-bar {

  flex-shrink: 0;
  border: 0;

}

.viz-badge {

.text-muted {

}

.tabular-nums {

}

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,

  min-height: 28px;

  color: var(--muted-foreground);

.nav-link:disabled,

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);

    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

}

#wd-board.wd-dark{color-scheme:dark}
/* 固定主题：整个板子自己铺底，不跟随宿主 */
#wd-board.wd-light,#wd-board.wd-dark{background:var(--wd-canvas);color:var(--wd-text);border-radius:20px;padding:20px}
#wd-board h1,#wd-board h2,#wd-board h3,#wd-board .wd-h1{color:var(--wd-text)}
#wd-board .wd-note,#wd-board .wd-kicker,#wd-board .wd-sub,#wd-board .wd-sw-label,
#wd-board .wd-sw-n,#wd-board .wd-sw-v,#wd-board .wd-dev-cap span,#wd-board .wd-grad-cap,
#wd-board .wd-radius-cap,#wd-board .wd-mat span,#wd-board .wd-elev span,#wd-board .wd-demo .cap,
#wd-board .text-muted{color:var(--wd-text2)}
#wd-board.wd-paused *{animation-play-state:paused!important}
#wd-board .wd-glassbase{
  background:var(--wd-glass);
  backdrop-filter:blur(var(--wd-blur)) saturate(1.7);
  -webkit-backdrop-filter:blur(var(--wd-blur)) saturate(1.7);
  border:1px solid var(--wd-hairline);
  box-shadow:inset 0 1px 0 var(--wd-hairline-top),var(--wd-sh1);
}

#wd-board .wd-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
#wd-board .wd-kicker{font-weight:500;letter-spacing:.9px;text-transform:uppercase}
#wd-board .wd-h1{margin:4px 0 0}
#wd-board .wd-sub{margin-top:2px}
#wd-board .wd-sec{margin-top:28px}
#wd-board h2{margin:0 0 2px}
#wd-board .wd-note{margin:0 0 12px}
#wd-board .wd-canvas-sheet{
  position:relative;overflow:hidden;
  background:var(--wd-canvas);border:1px solid var(--wd-hairline);border-radius:var(--wd-r);
  padding:18px;display:flex;flex-direction:column;gap:20px;color:var(--wd-text);
}
#wd-board .wd-canvas-sheet::before{content:&quot;&quot;;position:absolute;inset:0;background:var(--wd-wash);opacity:.55;pointer-events:none}
#wd-board .wd-canvas-sheet &gt; *{position:relative}

/* 色板 */
#wd-board .wd-sw-group{margin-bottom:14px}
#wd-board .wd-sw-label{margin-bottom:8px}
#wd-board .wd-sw-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
#wd-board .wd-sw{display:flex;flex-direction:column;gap:5px}
#wd-board .wd-sw-chip{height:44px;border-radius:var(--wd-r-sm);border:1px solid color-mix(in srgb,currentColor 16%,transparent)}
#wd-board .wd-sw-n,#wd-board .wd-sw-v{font-variant-numeric:tabular-nums}

/* 渐变条 */
#wd-board .wd-grad{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
#wd-board .wd-grad-item{display:flex;flex-direction:column;gap:6px}
#wd-board .wd-grad-bar{height:52px;border-radius:var(--wd-r-md);border:1px solid var(--wd-hairline);box-shadow:inset 0 1px 0 var(--wd-hairline-top)}
#wd-board .wd-grad-cap{font-size:11px;color:var(--wd-text2);font-variant-numeric:tabular-nums}

/* 圆角 */
#wd-board .wd-radius-row{display:flex;flex-wrap:wrap;gap:10px;background:var(--wd-sunken);border:1px solid var(--wd-hairline);border-radius:var(--wd-r);padding:14px;color:var(--wd-text)}
#wd-board .wd-radius-item{display:flex;flex-direction:column;align-items:center;gap:6px}
#wd-board .wd-radius-box{width:56px;height:56px;background:var(--wd-brand-tint);border:1px solid var(--wd-hairline);display:grid;place-items:center;font-size:11px;color:var(--wd-text2);font-variant-numeric:tabular-nums}
#wd-board .wd-radius-cap{font-size:11px;color:var(--wd-text3);font-variant-numeric:tabular-nums}

/* 材质 */
#wd-board .wd-mat-stage{position:relative;border-radius:var(--wd-r);overflow:hidden;background:var(--wd-canvas);border:1px solid var(--wd-hairline);padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
#wd-board .wd-mat-stage::before{content:&quot;&quot;;position:absolute;inset:0;background:
    radial-gradient(78% 92% at 10% 8%,color-mix(in srgb,#7EC4CF 80%,transparent) 0%,transparent 60%),
    radial-gradient(78% 92% at 90% 10%,color-mix(in srgb,#B0D5DF 88%,transparent) 0%,transparent 62%),
    radial-gradient(110% 100% at 54% 110%,color-mix(in srgb,#1685A9 40%,transparent) 0%,transparent 66%)}
#wd-board .wd-mat{position:relative;z-index:1;padding:12px 14px;border-radius:var(--wd-r-md);border:1px solid var(--wd-hairline);box-shadow:inset 0 1px 0 var(--wd-hairline-top),var(--wd-sh1);backdrop-filter:blur(var(--wd-blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--wd-blur)) saturate(1.7)}
#wd-board .wd-mat b{display:block;font-size:12px;font-weight:600;color:var(--wd-text)}
#wd-board .wd-mat span{font-size:11px;color:var(--wd-text2);font-variant-numeric:tabular-nums}
#wd-board .wd-mat.ultra{background:light-dark(rgba(255,255,255,.38),rgba(12,32,48,.34))}
#wd-board .wd-mat.thin{background:light-dark(rgba(255,255,255,.54),rgba(12,32,48,.48))}
#wd-board .wd-mat.regular{background:light-dark(rgba(255,255,255,.70),rgba(12,32,48,.62))}
#wd-board .wd-mat.thick{background:light-dark(rgba(255,255,255,.86),rgba(12,32,48,.78))}
#wd-board .wd-mat.tinted{background:var(--wd-grad-surface),light-dark(rgba(255,255,255,.5),rgba(10,18,54,.5))}

/* 高光扫过 */
#wd-board .wd-sheen-stage{position:relative;overflow:hidden;border-radius:var(--wd-r-md)}
#wd-board .wd-sheen{position:absolute;top:-40%;bottom:-40%;left:0;width:55%;background:var(--wd-grad-sheen);filter:blur(7px);pointer-events:none;animation:wdSheen 3.8s ease-in-out infinite}
@keyframes wdSheen{0%{transform:translateX(-130%)}52%,100%{transform:translateX(300%)}}

/* 层次 */
#wd-board .wd-elev-row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--wd-canvas);border:1px solid var(--wd-hairline);border-radius:var(--wd-r);padding:16px;position:relative;overflow:hidden}
#wd-board .wd-elev-row::before{content:&quot;&quot;;position:absolute;inset:0;background:var(--wd-wash);opacity:.5}
#wd-board .wd-elev{position:relative;background:var(--wd-card-solid);border-radius:var(--wd-r);padding:14px;color:var(--wd-text)}
#wd-board .wd-elev.e1{box-shadow:var(--wd-sh1)}
#wd-board .wd-elev.e2{box-shadow:var(--wd-sh2)}
#wd-board .wd-elev.e3{box-shadow:var(--wd-sh3)}
#wd-board .wd-elev b{display:block;font-size:13px;font-weight:600}
#wd-board .wd-elev span{font-size:11px;color:var(--wd-text2);font-variant-numeric:tabular-nums}

/* 组件通用 */
#wd-board [data-lucide]{width:18px;height:18px;flex:none}
#wd-board .wd-spec-h{font-size:12px;font-weight:600;color:var(--wd-text2);margin-bottom:10px}
#wd-board .wd-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#wd-board .wd-row + .wd-row{margin-top:10px}
#wd-board .wd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid transparent;white-space:nowrap;font-family:inherit;transition:transform .16s cubic-bezier(.2,1.5,.5,1),box-shadow .2s}
#wd-board .wd-btn.sm{height:32px;padding:0 12px;font-size:13px}
#wd-board .wd-btn.lg{height:52px;padding:0 20px;font-size:16px}
#wd-board .wd-btn.filled{background:var(--wd-grad-fill);color:var(--wd-on-brand);box-shadow:var(--wd-sh-brand),inset 0 1px 0 var(--wd-hairline-top)}
#wd-board .wd-btn.tonal{background:var(--wd-brand-soft);color:var(--wd-brand-strong);box-shadow:inset 0 1px 0 var(--wd-hairline-top)}
#wd-board .wd-btn.glass{background:light-dark(rgba(255,255,255,.9),rgba(16,36,54,.62));color:var(--wd-text);border-color:var(--wd-hairline);box-shadow:var(--wd-sh1)}
#wd-board .wd-btn.outline{background:transparent;border-color:var(--wd-hairline2);color:var(--wd-text)}
#wd-board .wd-btn.plain{background:transparent;color:var(--wd-brand);padding:0 8px}
#wd-board .wd-btn.destructive{background:var(--wd-danger-fill);color:#fff;box-shadow:0 6px 18px light-dark(rgba(24,30,92,.30),rgba(0,0,0,.52))}
#wd-board .wd-btn.pressed{transform:scale(.97)}
#wd-board .wd-btn[disabled]{opacity:.4}
#wd-board .wd-btn.focused{box-shadow:0 0 0 3px color-mix(in srgb,var(--wd-brand-bright) 34%,transparent)}
#wd-board .wd-spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;opacity:.85}
#wd-board .wd-seg{display:inline-flex;background:light-dark(rgba(255,255,255,.88),rgba(16,36,54,.6));border:1px solid var(--wd-hairline);border-radius:999px;padding:3px;gap:2px}
#wd-board .wd-seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--wd-text2);padding:6px 14px;border-radius:999px;transition:background .2s,color .2s}
#wd-board .wd-seg button.on{background:var(--wd-card-solid);color:var(--wd-text);font-weight:600;box-shadow:var(--wd-sh1)}
#wd-board .wd-chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;background:light-dark(rgba(255,255,255,.88),rgba(16,36,54,.6));color:var(--wd-text2);border:1px solid var(--wd-hairline)}
#wd-board .wd-chip.on{background:var(--wd-grad-surface);color:var(--wd-brand-strong);font-weight:600;border-color:color-mix(in srgb,var(--wd-brand) 42%,transparent);box-shadow:inset 0 1px 0 var(--wd-hairline-top),0 4px 12px color-mix(in srgb,var(--wd-brand) 18%,transparent)}
#wd-board .wd-chip.out{background:transparent;border-color:var(--wd-hairline2);color:var(--wd-text)}
#wd-board .wd-chip [data-lucide]{width:15px;height:15px}
#wd-board .wd-field{height:46px;border-radius:var(--wd-r-md);background:light-dark(rgba(255,255,255,.92),rgba(16,36,54,.62));border:1.5px solid var(--wd-hairline);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;color:var(--wd-text);min-width:190px;flex:1}
#wd-board .wd-field.on{border-color:var(--wd-brand-bright);box-shadow:0 0 0 3px color-mix(in srgb,var(--wd-brand-bright) 20%,transparent),inset 0 1px 0 var(--wd-hairline-top)}
#wd-board .wd-field [data-lucide]{width:17px;height:17px;color:var(--wd-text3)}
#wd-board .wd-field input{border:0;background:transparent;font:inherit;color:inherit;width:100%;outline:none;min-width:0}
#wd-board .wd-field input::placeholder{color:var(--wd-text3)}
#wd-board .wd-search{border-radius:999px}
#wd-board .wd-label{font-size:12px;color:var(--wd-text2);margin-bottom:6px}
#wd-board .wd-switchrow{display:flex;align-items:center;gap:12px;justify-content:space-between;min-width:210px;flex:1}
#wd-board .wd-switchrow .t{font-size:15px;color:var(--wd-text)}
#wd-board .wd-switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:light-dark(rgba(10,27,36,.14),rgba(255,255,255,.16));position:relative;flex:none;transition:background .26s;border:0;margin:0;box-shadow:inset 0 1px 2px light-dark(rgba(10,27,36,.10),rgba(0,0,0,.3))}
#wd-board .wd-switch::after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(8,40,90,.22),0 4px 10px rgba(8,40,90,.16);transition:transform .3s cubic-bezier(.2,1.5,.45,1)}
#wd-board .wd-switch:checked{background:var(--wd-grad-mid);box-shadow:0 4px 12px light-dark(rgba(22,119,179,.22),rgba(0,0,0,.4)),inset 0 1px 0 rgba(255,255,255,.3)}
#wd-board .wd-switch:checked::after{transform:translateX(20px)}

/* 现代勾选 */
#wd-board .wd-check{appearance:none;-webkit-appearance:none;position:relative;width:26px;height:26px;border-radius:9px;border:1.5px solid var(--wd-hairline2);background:var(--wd-field);flex:none;margin:0;transition:background .22s,border-color .22s,transform .2s cubic-bezier(.2,1.5,.5,1),box-shadow .22s}
#wd-board .wd-check::after{content:&quot;&quot;;position:absolute;inset:0;margin:auto;width:5px;height:10px;border-right:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:rotate(42deg) translate(-1px,-1px) scale(.3);opacity:0;transition:transform .26s cubic-bezier(.2,1.6,.5,1),opacity .14s}
#wd-board .wd-check:checked{background:var(--wd-grad-mid);border-color:transparent;box-shadow:0 4px 10px light-dark(rgba(22,119,179,.24),rgba(0,0,0,.42)),inset 0 1px 0 rgba(255,255,255,.32)}
#wd-board .wd-check:checked::after{opacity:1;transform:rotate(42deg) translate(-1px,-1px) scale(1)}
#wd-board .wd-check:active{transform:scale(.9)}
#wd-board .wd-check:indeterminate{background:var(--wd-grad-mid);border-color:transparent;box-shadow:0 4px 10px light-dark(rgba(22,119,179,.24),rgba(0,0,0,.42))}
#wd-board .wd-check:indeterminate::after{opacity:1;width:12px;height:0;border-right:0;border-bottom:2.4px solid #fff;transform:rotate(0) scale(1)}
#wd-board .wd-checkrow{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--wd-text)}
#wd-board .wd-glowwrap{position:relative;display:inline-grid;place-items:center;flex:none}
#wd-board .wd-glowwrap::before{content:&quot;&quot;;position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--wd-brand-bright) 42%,transparent) 0%,transparent 68%);opacity:0;transform:scale(.5);transition:opacity .4s ease,transform .45s cubic-bezier(.2,1.5,.5,1);pointer-events:none}
#wd-board .wd-glowwrap.on::before{opacity:1;transform:scale(1)}
#wd-board .wd-slider{appearance:none;width:100%;max-width:220px;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--wd-brand-bright) 0 62%,var(--wd-field) 62% 100%);margin:0}
#wd-board .wd-slider::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(8,40,90,.28);border:1px solid var(--wd-hairline)}
#wd-board .wd-stepper{display:inline-flex;align-items:center;background:var(--wd-glass);border:1px solid var(--wd-hairline);border-radius:999px;overflow:hidden}
#wd-board .wd-stepper button{border:0;background:transparent;font:inherit;font-size:18px;color:var(--wd-brand);width:40px;height:36px}
#wd-board .wd-stepper span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--wd-text);min-width:26px;text-align:center}

/* 卡片 / 列表 */
#wd-board .wd-card{position:relative;background:var(--wd-card);border:1px solid var(--wd-hairline);border-radius:var(--wd-r);box-shadow:var(--wd-sh1);padding:16px;color:var(--wd-text)}
#wd-board .wd-card.hero{background:var(--wd-grad-soft),var(--wd-card)}
#wd-board .wd-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#wd-board .wd-card-title{font-size:17px;font-weight:600}
#wd-board .wd-card-sub{font-size:13px;color:var(--wd-text2);margin-top:2px}
#wd-board .wd-list{display:flex;flex-direction:column}
#wd-board .wd-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--wd-hairline)}
#wd-board .wd-item:first-child{border-top:0}
#wd-board .wd-ico{width:34px;height:34px;border-radius:var(--wd-r-sm);background:var(--wd-grad-surface);color:var(--wd-brand-strong);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 var(--wd-hairline-top),0 4px 12px color-mix(in srgb,var(--wd-brand) 16%,transparent)}
#wd-board .wd-ico.deep{background:var(--wd-grad-mid);color:#FFFFFF;box-shadow:0 6px 16px light-dark(rgba(22,119,179,.2),rgba(0,0,0,.38))}
#wd-board .wd-ico [data-lucide]{width:18px;height:18px}
#wd-board .wd-item-t{flex:1;min-width:0}
#wd-board .wd-item-t b{display:block;font-size:15px;font-weight:500;color:var(--wd-text)}
#wd-board .wd-item-t span{font-size:12px;color:var(--wd-text2)}
#wd-board .wd-chev{color:var(--wd-text3);flex:none}
#wd-board .wd-chev [data-lucide]{width:16px;height:16px}
#wd-board .wd-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;border:2px solid light-dark(rgba(255,255,255,.9),rgba(8,26,44,.9));box-sizing:border-box;box-shadow:0 2px 6px rgba(10,60,100,.14)}
#wd-board .wd-av.a1{background:linear-gradient(135deg,#C9E4EB,#B0D5DF);color:#123F5C}
#wd-board .wd-av.a2{background:linear-gradient(135deg,#A3D6E0,#7EC4CF);color:#123F5C}
#wd-board .wd-av.a3{background:linear-gradient(135deg,#1B7FA8,#1677B3);color:#FFFFFF}
#wd-board .wd-av.a4{background:linear-gradient(135deg,#1677B3,#065279);color:#FFFFFF}
#wd-board .wd-stack{display:flex;align-items:center}
#wd-board .wd-stack .wd-av + .wd-av{margin-left:-9px}
#wd-board .wd-stack .more{background:var(--wd-glass-strong);color:var(--wd-text2);font-size:10px}
#wd-board .wd-ring{--p:60;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(from -90deg,var(--wd-brand) 0 calc(var(--p)*1%),color-mix(in srgb,var(--wd-brand-aqua) 55%,transparent) calc(var(--p)*1%) 100%)}
#wd-board .wd-ring i{width:46px;height:46px;border-radius:50%;background:var(--wd-card-solid);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--wd-text)}
#wd-board .wd-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
#wd-board .wd-badge.b{background:var(--wd-grad-surface);color:var(--wd-brand-strong);box-shadow:inset 0 1px 0 var(--wd-hairline-top)}
#wd-board .wd-badge.deep{background:var(--wd-grad-mid);color:#FFFFFF}
#wd-board .wd-badge.g{background:var(--wd-grad-soft),var(--wd-card);color:var(--wd-brand);border-color:var(--wd-hairline)}
#wd-board .wd-badge.d{background:var(--wd-danger-soft);color:var(--wd-danger)}
#wd-board .wd-dot{width:7px;height:7px;border-radius:50%;background:var(--wd-brand-bright);display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,var(--wd-brand-bright) 24%,transparent)}

/* 反馈 */
#wd-board .wd-banner{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--wd-r-md);font-size:13px;line-height:1.4;border:1px solid transparent}
#wd-board .wd-banner [data-lucide]{width:18px;height:18px;margin-top:1px}
#wd-board .wd-banner.ok{background:linear-gradient(135deg,color-mix(in srgb,var(--wd-success) 22%,transparent),color-mix(in srgb,var(--wd-success) 12%,transparent));border-color:color-mix(in srgb,var(--wd-success) 28%,transparent);color:light-dark(#1F6B4C,#94E0BE)}
#wd-board .wd-banner.warn{background:linear-gradient(135deg,color-mix(in srgb,var(--wd-warn) 22%,transparent),color-mix(in srgb,var(--wd-warn) 12%,transparent));border-color:color-mix(in srgb,var(--wd-warn) 28%,transparent);color:light-dark(#8A5A18,#EFC683)}
#wd-board .wd-banner.bad{background:linear-gradient(135deg,color-mix(in srgb,var(--wd-danger) 20%,transparent),color-mix(in srgb,var(--wd-danger) 11%,transparent));border-color:color-mix(in srgb,var(--wd-danger) 26%,transparent);color:light-dark(#A94A42,#EDA79E);font-weight:600}
#wd-board .wd-toast{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;background:light-dark(rgba(255,255,255,.94),rgba(16,36,54,.66));border:1px solid var(--wd-hairline);box-shadow:var(--wd-sh2);font-size:14px;color:var(--wd-text)}
#wd-board .wd-toast [data-lucide]{width:16px;height:16px;color:var(--wd-brand)}
#wd-board .wd-track{height:6px;border-radius:999px;background:color-mix(in srgb,var(--wd-brand-aqua) 55%,transparent);overflow:hidden;width:100%;max-width:220px}
#wd-board .wd-track i{display:block;height:100%;border-radius:999px;background:var(--wd-grad-brand)}
#wd-board .wd-skel{height:11px;border-radius:6px;background:linear-gradient(100deg,var(--wd-field) 30%,color-mix(in srgb,var(--wd-brand-hi) 30%,transparent) 50%,var(--wd-field) 70%);background-size:220% 100%;animation:wdShimmer 2.2s linear infinite}
#wd-board .wd-skel.w70{width:70%}
#wd-board .wd-skel.w45{width:45%}
@keyframes wdShimmer{0%{background-position:-120% 0}100%{background-position:220% 0}}

/* 动效演示 */
#wd-board .wd-demo-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
#wd-board .wd-demo{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--wd-r-md);background:var(--wd-sunken);border:1px solid var(--wd-hairline);min-height:118px;overflow:hidden}

#wd-board .wd-tab-and{position:relative;flex:none;height:74px;background:var(--wd-glass-strong);border-top:1px solid var(--wd-hairline);backdrop-filter:blur(20px) saturate(1.7);-webkit-backdrop-filter:blur(20px) saturate(1.7);display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px}

#wd-board .wd-tab-and [data-lucide]{width:22px;height:22px}
#wd-board .wd-appbar{position:relative;flex:none;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px}
#wd-board .wd-appbar .ttl{flex:1;font-size:21px;font-weight:600}
#wd-board .wd-appbar .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--wd-text)}
#wd-board .wd-appbar [data-lucide]{width:22px;height:22px}
#wd-board .wd-fab{position:absolute;right:18px;bottom:92px;width:56px;height:56px;border-radius:19px;background:var(--wd-grad-fill);color:var(--wd-on-brand);display:grid;place-items:center;box-shadow:var(--wd-sh-brand),var(--wd-sh2);z-index:1}

#wd-board .wd-chiprow{display:flex;gap:8px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  #wd-board *{animation:none!important}

&lt;script&gt;
(function () {
  var board = document.getElementById(&quot;wd-board&quot;);
  if (!board) return;

  /* 只切换组件填充的深浅 */
  var SURF = { surfL1: &quot;#B0D5DF&quot;, surfL2: &quot;#7EC4CF&quot;, surfD1: &quot;#123449&quot;, surfD2: &quot;#0F4055&quot; };
  var ACCENTS = {
    soft: Object.assign({ label: &quot;浅底 · 深字（默认）&quot;, brand: &quot;#1677B3&quot;,
            fill: &quot;linear-gradient(135deg,#8FCFDD,#63BAD2)&quot;,
            on: &quot;#0E3A55&quot;,
            mid: &quot;linear-gradient(135deg,#4FB0C8,#1685A9)&quot; }, SURF),
    mid:  Object.assign({ label: &quot;中蓝 · 白字&quot;, brand: &quot;#1677B3&quot;,
            fill: &quot;linear-gradient(135deg,#1677B3,#1B7FA8)&quot;,
            on: &quot;#FFFFFF&quot;,
            mid: &quot;linear-gradient(135deg,#1677B3,#1B7FA8)&quot; }, SURF),
    deep: Object.assign({ label: &quot;深蓝 · 白字&quot;, brand: &quot;#1677B3&quot;,
            fill: &quot;linear-gradient(135deg,#065279,#1E3B7A)&quot;,
            on: &quot;#FFFFFF&quot;,
            mid: &quot;linear-gradient(135deg,#065279,#1E3B7A)&quot; }, SURF)
  };

  var state = { accent: &quot;soft&quot;, appearance: &quot;light&quot;, radius: 24, blur: 22, playing: true };

  function apply() {
    board.classList.toggle(&quot;wd-light&quot;, state.appearance === &quot;light&quot;);
    board.classList.toggle(&quot;wd-dark&quot;, state.appearance === &quot;dark&quot;);
    var a = ACCENTS[state.accent] || ACCENTS.soft;
    board.style.setProperty(&quot;--wd-brand&quot;, a.brand);
    board.style.setProperty(&quot;--wd-brand-bright&quot;, a.brand);
    board.style.setProperty(&quot;--wd-grad-fill&quot;, a.fill);
    board.style.setProperty(&quot;--wd-on-brand&quot;, a.on);
    board.style.setProperty(&quot;--wd-grad-mid&quot;, a.mid);
    board.style.setProperty(&quot;--wd-grad-surface&quot;,
      &quot;linear-gradient(135deg,light-dark(&quot; + a.surfL1 + &quot;,&quot; + a.surfD1 + &quot;) 0%,light-dark(&quot; + a.surfL2 + &quot;,&quot; + a.surfD2 + &quot;) 100%)&quot;);
    board.style.setProperty(&quot;--wd-r&quot;, state.radius + &quot;px&quot;);
    board.style.setProperty(&quot;--wd-blur&quot;, state.blur + &quot;px&quot;);
  }

  apply();

  var half = document.getElementById(&quot;wd-check-half&quot;);
  if (half) {
    half.addEventListener(&quot;click&quot;, function (e) { e.preventDefault(); });
    half.indeterminate = true;
  }

  var select = document.getElementById(&quot;wd-appearance&quot;);
  if (select) {
    select.addEventListener(&quot;change&quot;, function () {
      state.appearance = select.value;
      apply();
    });
  }

  /* ---- 动效时间线 ---- */
  var E = {
    glow: document.getElementById(&quot;wd-demo-glow&quot;),
    check: document.getElementById(&quot;wd-demo-check&quot;),
    checkT: document.getElementById(&quot;wd-demo-check-t&quot;),
    sw: document.getElementById(&quot;wd-demo-switch&quot;),
    ring: document.getElementById(&quot;wd-demo-ring&quot;),
    ringN: document.getElementById(&quot;wd-demo-ring-num&quot;),
    toast: document.getElementById(&quot;wd-demo-toast&quot;),
    insert: document.getElementById(&quot;wd-demo-insert&quot;),
    toggle: document.getElementById(&quot;wd-anim-toggle&quot;)
  };
  var elapsed = 0;
  var last = null;
  var raf = 0;
  var reduce = window.matchMedia &amp;&amp; window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  var RING_MAX = 76;

  function setPlay(on) {
    state.playing = on;
    board.classList.toggle(&quot;wd-paused&quot;, !on);
    if (E.toggle) {
      E.toggle.textContent = on ? &quot;暂停&quot; : &quot;播放&quot;;
      E.toggle.setAttribute(&quot;aria-pressed&quot;, on ? &quot;false&quot; : &quot;true&quot;);
    }
  }

  function draw(t) {
    var on = ((t + 0.4) % 3.6) &lt; 2.2;
    if (E.check) E.check.checked = on;
    if (E.glow) E.glow.classList.toggle(&quot;on&quot;, on);
    if (E.checkT) E.checkT.textContent = on ? &quot;已完成&quot; : &quot;未完成&quot;;

    if (E.sw) E.sw.checked = ((t + 0.9) % 4.2) &lt; 2.6;

    var raw = Math.min(1, ((t + 0.8) % 5) / 3.2);
    var eased = 1 - Math.pow(1 - raw, 3);
    var pct = eased * RING_MAX;
    if (E.ring) E.ring.style.setProperty(&quot;--p&quot;, pct.toFixed(1));
    if (E.ringN) E.ringN.textContent = Math.round(pct) + &quot;%&quot;;

    if (E.toast) E.toast.classList.toggle(&quot;on&quot;, ((t + 0.2) % 4.8) &lt; 3.4);
    if (E.insert) E.insert.classList.toggle(&quot;on&quot;, ((t + 0.6) % 3.4) &lt; 2.4);
  }

  function frame(now) {
    if (!state.playing) { raf = 0; last = null; return; }
    if (last === null) last = now;
    elapsed += (now - last) / 1000;
    last = now;
    draw(elapsed);
    raf = window.requestAnimationFrame(frame);
  }

  function start() {
    if (raf) return;
    last = null;
    raf = window.requestAnimationFrame(frame);
  }

  function stop() {
    if (raf) window.cancelAnimationFrame(raf);
    raf = 0;
  }

  if (E.toggle) {
    E.toggle.addEventListener(&quot;click&quot;, function () {
      setPlay(!state.playing);
      if (state.playing) start(); else stop();
    });
  }

  if (reduce) {
    setPlay(false);
    draw(1.2);
  } else {
    setPlay(true);
    start();
  }

  if (globalThis.Tweak) {
    var tweak = new Tweak({ container: board, onChange: apply });
    tweak.addSelect(state, &quot;accent&quot;, {
      label: &quot;主色&quot;,
      options: [
        { label: &quot;浅底 · 深字（默认）&quot;, value: &quot;soft&quot; },
        { label: &quot;中蓝 · 白字&quot;, value: &quot;mid&quot; },
        { label: &quot;深蓝 · 白字&quot;, value: &quot;deep&quot; }
      ],
      reference: &quot;--wd-brand&quot;
    });
    tweak.addSlider(state, &quot;radius&quot;, { label: &quot;圆角&quot;, min: 12, max: 36, step: 2, unit: &quot;px&quot;, reference: &quot;radius.xl&quot; });
    tweak.addSlider(state, &quot;blur&quot;, { label: &quot;玻璃模糊&quot;, min: 0, max: 40, step: 4, unit: &quot;px&quot;, reference: &quot;material.thin.blur&quot; });
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
